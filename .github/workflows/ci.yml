name: go-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.x'
          cache: false
      - name: Unit and contract checks
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Compile CLI
        run: go build -o golingua ./cmd/golingua
      - name: CLI smoke
        run: |
          ./golingua --version
          ./golingua capabilities --json
