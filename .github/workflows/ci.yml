name: go-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.x'
          cache: false
      - name: Go formatting
        run: |
          files="$(git ls-files '*.go')"
          if [ -n "$files" ]; then
            unformatted="$(gofmt -l $files)"
            if [ -n "$unformatted" ]; then
              printf 'Unformatted files:\n%s\n' "$unformatted"
              exit 1
            fi
          fi
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build -o golingua ./cmd/golingua
      - name: CLI starts
        run: |
          ./golingua --version
          ./golingua --help
