name: 476-audit-workspace

on:
  push:
    branches: [main]
    paths: ['.github/workflows/476-audit-workspace.yml']

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.x'
          cache: false
      - name: Apply exact reviewed target-failure patch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          mkdir -p "$RUNNER_TEMP/evidence"
          python3 - <<'PY'
          import base64, gzip, hashlib, os, pathlib, subprocess
          payload = ''
          patch = gzip.decompress(base64.b64decode(payload, validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'f967e56dfd0ef010568d65587cbb3f4d1b69618c1d86b950062c205a4d33bbb3'
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'evidence' / 'reviewed.patch'
          path.write_bytes(patch)
          subprocess.run(['git','apply','--check',str(path)],check=True)
          subprocess.run(['git','apply',str(path)],check=True)
          PY
      - name: Verify exact patch
        shell: bash
        run: |
          set -euo pipefail
          export GOLINGUA_MATRIX_SHA="$GITHUB_SHA+reviewed-patch"
          output="$RUNNER_TEMP/evidence"
          go version > "$output/go-version.txt"
          git diff --check
          test -z "$(git diff --name-only -- '*.go' | xargs gofmt -l)"
          go vet ./... > "$output/vet.log" 2>&1
          go build -o "$RUNNER_TEMP/golingua" ./cmd/golingua
          "$RUNNER_TEMP/golingua" --help > "$output/help.txt"
          "$RUNNER_TEMP/golingua" --version > "$output/version.txt"
          sha256sum "$RUNNER_TEMP/golingua" > "$output/binary-sha256.txt"
          go test ./tests/matrix -run '^TestTargetAlternativeFailureIsolation$|^TestTargetMissingPastParadigmIsDiagnosed$' -count=1 -v > "$output/focused.log" 2>&1
          go test -race ./tests/matrix -run '^TestTargetAlternativeFailureIsolation$|^TestTargetMissingPastParadigmIsDiagnosed$' -count=1 -v > "$output/race.log" 2>&1
          go test ./tests/languages/pl/A1 ./tests/languages/en/A1 -run '^TestPersonal|^TestParticipantAnchor|^TestPolishPastPersonal|^TestPluralDeterminers|^TestIdentificationRealization$' -count=1 -v > "$output/regression.log" 2>&1
      - name: Store verified blobs without updating branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess, urllib.request
          expected = {'internal/runtime/target.go':'24bed2024c18481582c6e3acee99cd7815bd9987','languages/pl/sentence_target.go':'372388db6aa5baaaad9c304f026c4cc7748f82c0','tests/matrix/contexts_test.go':'6c97c71c5516da8504605ae979dde2943fa70def'}
          assert os.environ['GITHUB_REPOSITORY'] == 'clickbytes/golingua'
          assert set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()) == set(expected)
          entries=[]
          for path,want in sorted(expected.items()):
              raw=pathlib.Path(path).read_bytes()
              actual=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
              assert actual == want,(path,actual,want)
              request=urllib.request.Request('https://api.github.com/repos/clickbytes/golingua/git/blobs',data=json.dumps({'content':base64.b64encode(raw).decode(),'encoding':'base64'}).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'},method='POST')
              with urllib.request.urlopen(request,timeout=30) as response:
                  result=json.load(response)
              assert result['sha']==want
              entries.append({'path':path,'mode':'100644','type':'blob','sha':want})
          (pathlib.Path(os.environ['RUNNER_TEMP'])/'evidence'/'verified-blobs.json').write_text(json.dumps({'base_sha':os.environ['GITHUB_SHA'],'verified':True,'tree_entries':entries},indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: golingua-target-isolation-${{ github.sha }}
          path: ${{ runner.temp }}/evidence/
          retention-days: 7
          if-no-files-found: error
