name: 476-audit-workspace

on:
  push:
    branches: [main]
    paths: ['.github/workflows/476-audit-workspace.yml']

permissions:
  contents: write

jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.x'
          cache: false
      - name: Apply exact locally reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          mkdir -p "$RUNNER_TEMP/evidence"
          python3 - <<'PY'
          import base64, gzip, hashlib, os, pathlib, subprocess
          payload = ''
          payload = payload.replace('SLPlPlV', 'SLPlV')
          patch = gzip.decompress(base64.b64decode(payload, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '4af5f02e0a2c5ba5e6c4dbb481f69c239aa1ffea7ae0c71c4c8ce44326813cbd'
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'evidence' / 'reviewed.patch'
          path.write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', str(path)], check=True)
          subprocess.run(['git', 'apply', str(path)], check=True)
          PY
      - name: Verify Go checks and focused regressions
        shell: bash
        run: |
          set -euo pipefail
          export GOLINGUA_MATRIX_SHA="$GITHUB_SHA+reviewed-patch"
          output="$RUNNER_TEMP/evidence"
          go version | tee "$output/go-version.txt"
          git diff --check
          test -z "$(git diff --name-only -- '*.go' | xargs gofmt -l)"
          go vet ./... 2>&1 | tee "$output/vet.log"
          go build -o "$RUNNER_TEMP/golingua" ./cmd/golingua
          "$RUNNER_TEMP/golingua" --help > "$output/help.txt"
          "$RUNNER_TEMP/golingua" --version > "$output/version.txt"
          sha256sum "$RUNNER_TEMP/golingua" > "$output/binary-sha256.txt"
          go test ./tests/languages/pl/A1 ./tests/languages/en/A1 -run '^TestPersonal|^TestEnglishYou|^TestParticipantAnchor|^TestPolishPastPersonal|^TestPluralDeterminers|^TestIdentificationRealization$' -count=1 -v > "$output/focused.log" 2>&1
          go test ./tests/translation/pl-en -run '^TestNegation$/^A1-NEG-004-PL-EN$' -count=3 -v > "$output/negation.log" 2>&1
          go test -race ./tests/languages/en/A1 -run '^TestPluralDeterminersConcurrentNegativeRealization$' -count=1 -v > "$output/race.log" 2>&1
      - name: Store verified content objects without updating any branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess, urllib.request
          expected = {"internal/realizer/execute.go":"cc6a9c85c7d0461ceb1deb10468daa4dea1b6c0a","internal/runtime/slot_execution.go":"38bb29c8a6f321dd4a36657bc6e7e47e61a617d0","languages/en/sentence_negation.go":"ea809bfb01ce94170026951740ab6f03b1ce4909","languages/en/sentence_source.go":"03c46ec7a781c0b46a0f242cf551c721afbc733c","languages/en/sentence_target.go":"e4f8d0599b62e292069bc34aab8eba3944ceb6ce","languages/pl/sentence_source.go":"c8734fb96cc1c86727371a7ed1c93501da699918","languages/pl/sentence_target.go":"430515f8653ab2d83a8c289bf50bea542c5eb60a","tests/languages/en/A1/plural_determiners_test.go":"43b9955ba001e1b4294709549fe51a3208a17da4","tests/languages/pl/A1/participants_test.go":"c1ff738a9bb1a536188327dabf51854f9e4b15b4"}
          changed = subprocess.check_output(['git','diff','--name-only'], text=True).splitlines()
          assert set(changed) == set(expected), changed
          assert os.environ['GITHUB_REPOSITORY'] == 'clickbytes/golingua'
          entries = []
          for path, want in sorted(expected.items()):
              raw = pathlib.Path(path).read_bytes()
              actual = hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
              assert actual == want, (path,actual,want)
              request = urllib.request.Request('https://api.github.com/repos/clickbytes/golingua/git/blobs', data=json.dumps({'content':base64.b64encode(raw).decode(),'encoding':'base64'}).encode(), headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'}, method='POST')
              with urllib.request.urlopen(request, timeout=30) as response:
                  result = json.load(response)
              assert result['sha'] == want
              entries.append({'path':path,'mode':'100644','type':'blob','sha':want})
          output = pathlib.Path(os.environ['RUNNER_TEMP'])/'evidence'/'verified-blobs.json'
          output.write_text(json.dumps({'base_sha':os.environ['GITHUB_SHA'],'verified':True,'tree_entries':entries},indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: golingua-reviewed-patch-${{ github.sha }}
          path: ${{ runner.temp }}/evidence/
          retention-days: 7
          if-no-files-found: error
