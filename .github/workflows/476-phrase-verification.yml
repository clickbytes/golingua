name: 476-phrase-verification

on:
  push:
    branches: [main]
    paths: ['.github/workflows/476-phrase-verification.yml']

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.x'
          cache: false
      - name: Apply checksum-pinned reviewed changes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_REPOSITORY" = clickbytes/golingua
          mkdir -p "$RUNNER_TEMP/phrase-verification"
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess, urllib.request, zlib
          out = pathlib.Path(os.environ['RUNNER_TEMP'], 'phrase-verification')
          url = 'https://api.github.com/repos/clickbytes/golingua/git/blobs/facf8718fdffbb78825f3f5122d80ad7ef76b9dd'
          req = urllib.request.Request(url, headers={'Authorization': 'Bearer '+os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
          with urllib.request.urlopen(req) as response:
              value = json.load(response)
          encoded = base64.b64encode(base64.b64decode(value['content'])).decode()
          # Exact transport corrections determined by byte comparison with the
          # local reviewed bundle; the resulting complete blob must match its pin.
          for start, end, text in reversed([[214,214,'+Y'],[1667,1669,'K'],[1850,1851,'']]):
              encoded = encoded[:start] + text + encoded[end:]
          data = base64.b64decode(encoded, validate=True)
          digest = hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          assert digest == 'fe0e38e39c198cc8b1b353a503390ba3658223c3', digest
          bundle = json.loads(zlib.decompress(data))
          manifest = bundle['manifest']
          assert set(manifest['before']) == set(manifest['after']) == set(bundle['changes'])
          for name, old in manifest['before'].items():
              p = pathlib.Path(name)
              assert not p.is_absolute() and '..' not in p.parts and p.parts[0] in {'internal','languages','tests','docs'}
              if old is None:
                  assert not p.exists(), name
              else:
                  assert subprocess.check_output(['git','hash-object',name], text=True).strip() == old, name
          for name, edits in bundle['changes'].items():
              p = pathlib.Path(name)
              lines = p.read_text().splitlines(keepends=True) if p.exists() else []
              for start, end, text in reversed(edits):
                  assert 0 <= start <= end <= len(lines), name
                  lines[start:end] = [text]
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(''.join(lines))
              assert subprocess.check_output(['git','hash-object',name], text=True).strip() == manifest['after'][name], name
          subprocess.run(['git','add','-N',*manifest['after']], check=True)
          patch = subprocess.check_output(['git','diff','--binary','--full-index','HEAD'])
          assert hashlib.sha256(patch).hexdigest() == manifest['patch_sha256'], 'reviewed diff mismatch'
          (out/'reviewed.patch').write_bytes(patch)
          (out/'expected-blobs.json').write_text(json.dumps(manifest, indent=2))
          PY
      - name: Verify exact code and independent contracts
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/phrase-verification"
          go version > "$out/go-version.txt"
          test -z "$(gofmt -l $(git diff --name-only -- '*.go'))"
          git diff --check
          go vet ./... > "$out/vet.log" 2>&1
          go build -o "$RUNNER_TEMP/golingua" ./cmd/golingua
          "$RUNNER_TEMP/golingua" --version > "$out/version.txt"
          "$RUNNER_TEMP/golingua" --help > "$out/help.txt"
          go test ./tests/matrix -count=1 -v > "$out/matrix-unit.log" 2>&1
          go test ./tests/interlingua -run ColorBoundaries -count=1 -v > "$out/color.log" 2>&1
          go test -race ./tests/matrix -run '^TestNegativePhrase' -count=1 -v > "$out/race.log" 2>&1
          sha256sum "$RUNNER_TEMP/golingua" > "$out/binary-sha256.txt"
      - name: Verify real CLI flows
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/phrase-verification"
          "$RUNNER_TEMP/golingua" snapshot --apply --store "$RUNNER_TEMP/phrase-store" --json > "$out/snapshot.json"
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          root = pathlib.Path(os.environ['RUNNER_TEMP']); out = root/'phrase-verification'
          cfg = root/'phrase-runtime.json'
          cfg.write_text(json.dumps({'schema_version':1,'dataset_store':str(root/'phrase-store'),'dataset_id':'golingua-authored'}))
          cases = [('en','The teachers did not see the black cats.','Nauczyciele nie widzieli czarnych kotów.'),('en','Teachers do not see black cats.','Nauczyciele nie widzą czarnych kotów.'),('pl','Nauczyciele nie widzieli czarnych kotów.','Teachers did not see black cats.'),('en','Teachers do not give water to a doctor.','Nauczyciele nie dają lekarzowi wody.'),('en','The teacher does not give an apple to the doctor.','Nauczyciel nie daje lekarzowi jabłka.'),('en','The teachers does not see the black cats.',None),('en','The teacher does not see an black cat.',None)]
          rows=[]
          for lang,text,want in cases:
              args=[str(root/'golingua'),'translate','--from',lang,'--to','pl' if lang=='en' else 'en','--text',text,'--runtime-config',str(cfg),'--json']
              p=subprocess.run(args,capture_output=True,text=True,timeout=30)
              result=json.loads(p.stdout)
              texts={c['text'] for c in result.get('candidates',[]) if c.get('text')}
              rows.append({'input':text,'from':lang,'exit_code':p.returncode,'result':result,'stderr':p.stderr})
              (out/'cli.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2))
              assert (want in texts) if want is not None else (not texts and result['status'] != 'ok'), (text,texts,result['status'])
          PY
      - name: Store verified blobs without moving a branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, os, pathlib, subprocess, urllib.request
          out = pathlib.Path(os.environ['RUNNER_TEMP'], 'phrase-verification')
          manifest = json.loads((out/'expected-blobs.json').read_text())
          files=[]
          for name,want in manifest['after'].items():
              assert subprocess.check_output(['git','hash-object',name],text=True).strip() == want, name
              body=json.dumps({'content':base64.b64encode(pathlib.Path(name).read_bytes()).decode(),'encoding':'base64'}).encode()
              req=urllib.request.Request('https://api.github.com/repos/clickbytes/golingua/git/blobs',data=body,method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Content-Type':'application/json','Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req) as response:
                  blob=json.load(response)
              assert blob['sha']==want, name
              files.append({'path':name,'mode':'100644','type':'blob','sha':want})
          (out/'verified-blobs.json').write_text(json.dumps({'verification_sha':os.environ['GITHUB_SHA'],'files':files},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: golingua-phrase-verified-${{ github.sha }}
          path: ${{ runner.temp }}/phrase-verification/
          retention-days: 7
          if-no-files-found: error
