name: 476-index-verification
on:
  push:
    branches: [main]
    paths: ['.github/workflows/476-index-verification.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.x'
          cache: false
      - name: Apply the exact locally verified patch
        env:
          PATCH_B64: 
        run: |
          mkdir -p "$RUNNER_TEMP/index-evidence"
          python3 - <<'PY'
          import os,base64,gzip,hashlib,pathlib,subprocess
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'index-evidence'
          patch=gzip.decompress(base64.b64decode(os.environ['PATCH_B64']))
          assert hashlib.sha256(patch).hexdigest()=='dc59e905253e888241b9fcf7f5c4029fb39671aed6fd4316a346e29f36ff0b2c'
          expected={'internal/valency/index.go':'379c55bd43ae9bdd6bb3a1556800628e4762b9e2','internal/construction/registry.go':'1ef5df65344edd15b4001576a65cde4ed096042c','internal/realizer/select.go':'05fe4fe42afd6baedfbd496d51402783f8be8406','tests/matrix/contexts_test.go':'6c97c71c5516da8504605ae979dde2943fa70def'}
          for path,sha in expected.items():
              assert subprocess.check_output(['git','hash-object',path],text=True).strip()==sha,path
          (out/'reviewed.patch').write_bytes(patch)
          subprocess.run(['git','apply','--check',str(out/'reviewed.patch')],check=True)
          subprocess.run(['git','apply',str(out/'reviewed.patch')],check=True)
          assert set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())==set(expected)
          PY
      - name: Verify exact patch
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/index-evidence"
          export GOLINGUA_MATRIX_SHA="$GITHUB_SHA+reviewed-patch"
          go version > "$out/go-version.txt"
          test -z "$(gofmt -l internal/valency/index.go internal/construction/registry.go internal/realizer/select.go tests/matrix/contexts_test.go)"
          git diff --check
          go vet ./... > "$out/vet.log" 2>&1
          go build -o "$out/golingua" ./cmd/golingua
          "$out/golingua" --help > "$out/help.txt"
          "$out/golingua" --version > "$out/version.txt"
          go test ./tests/matrix -run 'TestTargetSelection|TestCompiledBinding' -count=1 -v > "$out/focused.log" 2>&1
          go test -race ./tests/matrix -run 'TestTargetSelection|TestCompiledBinding' -count=1 -v > "$out/race.log" 2>&1
          go test ./tests/translation/pl-en -run '^TestOtherDomains$/^A1.3-CO-307-PL-EN$' -count=1 -v > "$out/composition.log" 2>&1
          sha256sum "$out/golingua" > "$out/binary-sha256.txt"
          rm "$out/golingua"
      - name: Store verified blobs without moving branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os,json,pathlib,urllib.request,hashlib
          expected={'internal/construction/registry.go':'efbe3bb077aaff6b08ca3377d40aea7db0ef0f1d','internal/realizer/select.go':'15220f05807f620660f575aa318cd1a87dadd224','internal/valency/index.go':'33e347ad5f670cbf0665941d7d3a94580c71a2ed','tests/matrix/contexts_test.go':'7f192e3e5698c051ff93191dfde2373991f3cdd5'}
          result={}
          for path,sha in expected.items():
              raw=pathlib.Path(path).read_bytes()
              assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()==sha,path
              request=urllib.request.Request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/git/blobs',data=json.dumps({'content':raw.decode(),'encoding':'utf-8'}).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'},method='POST')
              with urllib.request.urlopen(request) as response: stored=json.load(response)
              assert stored['sha']==sha,path
              result[path]=sha
          (pathlib.Path(os.environ['RUNNER_TEMP'])/'index-evidence'/'verified-blobs.json').write_text(json.dumps(result,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: golingua-index-verification-${{ github.sha }}
          path: ${{ runner.temp }}/index-evidence/
          retention-days: 7
          if-no-files-found: error
