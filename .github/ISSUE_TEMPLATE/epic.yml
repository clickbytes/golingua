name: Epic
description: One serial, bounded GoLingua v0 milestone
title: "[EPIC] "
body:
  - type: textarea
    id: goal
    attributes:
      label: Observable product finish line
      description: State what an actual CLI/TUI user can do when complete.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Included scope and explicit exclusions
      value: "GoLingua v0; no speculative product v2, migrations, JS parity or new tests by default."
    validations:
      required: true
  - type: textarea
    id: children
    attributes:
      label: Ordered queue and current child
      description: Keep future tasks queued in this epic. Create/open only the current child issue.
      value: |
        - Active child: NONE
        - Next queued vertical slice:
        - Later slices:
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Required acceptance criteria and evidence
      description: Record actual observable results. NOT RUN does not prove mandatory technical behavior. Owner linguistic acceptance is independent from technical acceptance.
    validations:
      required: true
  - type: checkboxes
    id: policy
    attributes:
      label: Coordination rules
      options:
        - label: One active epic, one child, one implementation branch and PR; only Codex Sol Medium coordinates and writes GitHub.
          required: true
        - label: New tests, migrations and broader design require explicit owner authorization and current issue scope.
          required: true
